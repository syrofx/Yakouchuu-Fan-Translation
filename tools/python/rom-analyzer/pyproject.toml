[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-analyzer"
version = "0.1.0"
description = "SNES ROM analysis utility for Yakouchuu translation project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rom-analyzer = "rom_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]